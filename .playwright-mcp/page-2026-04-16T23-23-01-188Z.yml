                    - time [ref=e114]: 55 sem
                  - generic [ref=e115]: "“Tassi, por que você escolheu se especializar no tratamento da ansiedade?” Essa é uma pergunta que eu recebo com frequência. E a resposta é simples: Porque eu vivi isso. Na pele. No corpo. Na mente. E por muito tempo, no silêncio. Eu não estudei ansiedade só pelos livros. Eu estive no lugar de quem sente o coração disparar sem motivo. De quem acorda cansada, vive em estado de alerta, evita sair sozinha porque o medo tomou espaço demais. Descobrir que eu tinha transtorno de pânico e TAG foi um ponto de virada na minha vida. Mas, curiosamente, foi também o que me tornou uma terapeuta melhor. Mais humana. Mais consciente. Mais comprometida em oferecer, além de técnica, um cuidado verdadeiro. Hoje, cada paciente que entra no meu consultório carrega um pedaço da história que um dia foi minha. E eu vejo, em cada um deles, a possibilidade de reescrever essa história com mais leveza, autonomia e presença. Se você está nesse caminho, talvez ainda no início dele, eu só quero que saiba: Você não está sozinha. E sim, existe um caminho possível entre a ansiedade e a vida que você quer viver. Fica aqui comigo. Tem muito mais que eu quero te mostrar."
