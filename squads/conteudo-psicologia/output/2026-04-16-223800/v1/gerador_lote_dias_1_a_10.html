<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador Visual EDITORIAL (Dias 1 a 10)</title>
<!-- Fontes em Alta: Playfair Display (Serifa Elegante) e Inter (Clean) -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { background-color: #EFEBE7; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
  .toolbar { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; position: sticky; top: 20px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 80%; }
  button { background-color: #5C564B; color: white; border: none; padding: 15px 30px; font-size: 18px; font-family: 'Inter'; border-radius: 50px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
  button:hover { background-color: #403b33; }
  .post-section { width: 100%; margin-bottom: 50px; }
  .post-title { color: #333; font-size: 24px; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
  .slide-container { display: flex; flex-wrap: wrap; gap: 20px; }
  
  .slide { 
    width: 1080px; height: 1080px; 
    background-color: #F8F5F2; /* Tom Areia Suave */
    color: #2D2D2D; 
    padding: 120px; box-sizing: border-box; 
    display: flex; flex-direction: column; justify-content: center; 
    position: relative; overflow: hidden; 
    transform: scale(0.3); transform-origin: top left; 
    margin-bottom: -756px; margin-right: -756px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  }
  
  /* Background de Fotos Únicas c/ Filtro Estético */
  .slide.photo-bg { background-size: cover; background-position: center; }
  .slide.photo-bg::before { 
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
    background: linear-gradient(180deg, rgba(30,28,26,0.3) 0%, rgba(30,28,26,0.7) 100%); 
    z-index: 1; 
  }
  .slide.photo-bg h1, .slide.photo-bg p, .slide.photo-bg .logo { position: relative; z-index: 2; color: #F8F5F2; }
  
  /* Tipografia Editorial */
  .slide h1 { font-family: 'Playfair Display', serif; font-size: 90px; line-height: 1.1; font-weight: 600; margin: 0 0 40px 0; letter-spacing: -1px; }
  .slide p { font-size: 50px; line-height: 1.5; font-weight: 300; margin: 0; }
  
  /* Layout Lembrete (Estilo Twitter/Notes em alta) */
  .slide.note-style { background-color: #EFEBE7; }
  .note-box { background: white; padding: 80px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); z-index: 2; position: relative; }
  .slide.note-style h1 { font-size: 70px; color: #333; }
  .slide.note-style p { font-size: 45px; color: #555; }
  
  .logo { position: absolute; bottom: 80px; left: 120px; font-size: 30px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }
  .slide.photo-bg .logo { color: rgba(255,255,255,0.7); }
  
  /* Detalhe de Cor */
  .highlight { font-style: italic; color: #8A7B6E; }
  .photo-bg .highlight { color: #D4C5B9; }

</style>
</head>
<body>

<div class="toolbar">
  <h2 style="margin-top:0; font-family: 'Playfair Display', serif;">Gerador Editorial (Dias 1 a 10)</h2>
  <button onclick="downloadAll()">Baixar Fotos Únicas em PNG</button>
  <p id="status" style="margin-bottom:0; color:#666; font-size:14px; margin-top:10px;">Estética "Minimalista Chic" aplicada. Cada capa possui uma imagem exclusiva.</p>
</div>

<div id="feed"></div>

<script>
  const postsData = [
    {
      day: 1, title: "Ansiedade de Alta Performance",
      slides: [
        { type: 'photo', text: '<h1>Todo mundo acha que você é <span class="highlight">"forte"</span>, mas você não consegue descansar sem se sentir <span class="highlight">culpada</span>?</h1>' },
        { type: 'note', text: '<div class="note-box"><p>Por fora, você é a pessoa que resolve tudo. Entrega os prazos, ajuda a família, mantém a rotina. Você parece o oposto de alguém com ansiedade.</p></div>' },
        { type: 'light', text: '<h1>A história é outra.</h1><p>O seu motor não é a motivação, é o medo de falhar.</p>' }
      ]
    },
    {
      day: 2, title: "Tristeza x Depressão",
      slides: [
        { type: 'photo', text: '<h1>A diferença silenciosa entre Tristeza normal e <span class="highlight">Depressão Clínica</span></h1>' },
        { type: 'note', text: '<div class="note-box"><p>A tristeza é temporária. A depressão sequestra a sua energia vital e distorce como você enxerga a si mesma.</p></div>' },
        { type: 'light', text: '<h1>Não encare como frescura.</h1><p>Se a tristeza se instalou e não vai embora, busque avaliação.</p>' }
      ]
    },
    {
      day: 3, title: "Técnica TIPP",
      slides: [
        { type: 'photo', text: '<h1>Como usar a técnica <span class="highlight">TIPP</span> para evitar uma crise de pânico</h1>' },
        { type: 'light', text: '<p>Tentar "pensar positivo" na crise não funciona, porque seu cérebro lógico está bloqueado. Você precisa intervir no corpo.</p>' },
        { type: 'note', text: '<div class="note-box"><h1>T.I.P.P.</h1><p>Temperatura, Intensidade, Pacing (Ritmo) e Paired Muscle Relaxation.</p></div>' }
      ]
    },
    {
      day: 4, title: "Perfeccionismo Afasta",
      slides: [
        { type: 'photo', text: '<h1>Por que o seu <span class="highlight">perfeccionismo</span> afasta as pessoas que você ama?</h1>' },
        { type: 'note', text: '<div class="note-box"><p>Quando você tem regras extremamente rígidas, qualquer falha do outro parece uma ofensa pessoal.</p></div>' }
      ]
    },
    {
      day: 5, title: "Descanso Culposo",
      slides: [
        { type: 'photo', text: '<h1>A exaustiva crença de que <span class="highlight">"se eu não produzo, não tenho valor"</span></h1>' },
        { type: 'light', text: '<h1>O descanso culposo.</h1><p>Construímos uma "crença condicional" de amor condicionado à utilidade.</p>' }
      ]
    },
    {
      day: 6, title: "3 Sinais de Burnout",
      slides: [
        { type: 'photo', text: '<h1>Burnout não é só estresse: <span class="highlight">os 3 sinais silenciosos</span></h1>' },
        { type: 'note', text: '<div class="note-box"><p>1. Exaustão emocional profunda.<br>2. Cinismo / Frieza.<br>3. Baixa realização profissional.</p></div>' }
      ]
    },
    {
      day: 7, title: "Emoções em dobro",
      slides: [
        { type: 'photo', text: '<h1>Você sente as emoções com o <span class="highlight">dobro da intensidade</span> dos outros?</h1>' },
        { type: 'light', text: '<h1>Não é drama.</h1><p>É o funcionamento neurobiológico do seu sistema de regulação emocional.</p>' }
      ]
    },
    {
      day: 8, title: "Leitura de Mente",
      slides: [
        { type: 'photo', text: '<h1>Distorções Cognitivas: O que é a <span class="highlight">Leitura de Mente</span>?</h1>' },
        { type: 'note', text: '<div class="note-box"><p>"Ele não respondeu, certeza que está com raiva de mim." Acreditamos saber exatamente o que o outro pensa.</p></div>' }
      ]
    },
    {
      day: 9, title: "Primeira Sessão",
      slides: [
        { type: 'photo', text: '<h1>O que realmente acontece na <span class="highlight">primeira sessão</span> de terapia?</h1>' },
        { type: 'light', text: '<p>Não tem divã escuro. É uma avaliação acolhedora para entender sua dor e traçar um plano baseado em evidências.</p>' }
      ]
    },
    {
      day: 10, title: "Ansiedade Matinal",
      slides: [
        { type: 'photo', text: '<h1>Ansiedade matinal: por que o coração <span class="highlight">já acorda acelerado</span>?</h1>' },
        { type: 'note', text: '<div class="note-box"><p>O pico natural de cortisol pela manhã é lido pelo cérebro ansioso como um "Sinal de Perigo".</p></div>' }
      ]
    }
  ];

  const feedDiv = document.getElementById('feed');
  let photoIdOffset = 100; // Seed for unique photos

  postsData.forEach(post => {
    const section = document.createElement('div');
    section.className = 'post-section';
    section.innerHTML = `<div class="post-title">Dia ${String(post.day).padStart(2, '0')}: ${post.title}</div><div class="slide-container" id="container-${post.day}"></div>`;
    feedDiv.appendChild(section);
    
    const container = document.getElementById(`container-${post.day}`);
    
    post.slides.forEach((slideData, idx) => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.id = `img-day${post.day}-slide${idx+1}`;
      
      if(slideData.type === 'note') slide.classList.add('note-style');
      if(slideData.type === 'photo') {
        slide.classList.add('photo-bg');
        // Unsplash via LoremFlickr ensuring high res aesthetic photos with distinct locks
        const imgUrl = `https://loremflickr.com/1080/1080/aesthetic,minimalist,calm?lock=${photoIdOffset + post.day}`;
        slide.style.backgroundImage = `url('${imgUrl}')`;
      }
      
      slide.innerHTML = slideData.text + '<div class="logo">Psicóloga Tamiris Redivo</div>';
      container.appendChild(slide);
    });
  });

  async function downloadAll() {
    const status = document.getElementById('status');
    const buttons = document.getElementsByTagName('button')[0];
    buttons.disabled = true;
    
    let totalSlides = postsData.reduce((acc, post) => acc + post.slides.length, 0);
    let count = 0;

    for(const post of postsData) {
      for(let idx = 0; idx < post.slides.length; idx++) {
        count++;
        status.innerText = `Gerando imagem ${count} de ${totalSlides}... (Dia ${post.day})`;
        const slideEl = document.getElementById(`img-day${post.day}-slide${idx+1}`);
        
        slideEl.style.transform = 'none';
        slideEl.style.marginBottom = '0';
        slideEl.style.marginRight = '0';

        const canvas = await html2canvas(slideEl, { scale: 2, useCORS: true, allowTaint: true }); 
        const link = document.createElement('a');
        link.download = `Dia_${String(post.day).padStart(2, '0')}_Slide_${idx+1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        slideEl.style.transform = 'scale(0.3)';
        slideEl.style.marginBottom = '-756px';
        slideEl.style.marginRight = '-756px';

        await new Promise(r => setTimeout(r, 600)); 
      }
    }
    status.innerText = "Download concluído com sucesso!";
    buttons.disabled = false;
  }
</script>
</body>
</html>
